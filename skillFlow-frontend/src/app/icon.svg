<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Rocket Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="25%" stop-color="#2563eb" />
      <stop offset="55%" stop-color="#4f46e5" />
      <stop offset="80%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Flow Swoosh Gradient -->
    <linearGradient id="swooshGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="85%" stop-color="#06b6d4" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="1" />
    </linearGradient>

    <!-- Mask to punch out entire rocket footprint from swoosh -->
    <mask id="solidRocketMask">
      <!-- White keeps swoosh -->
      <rect x="0" y="0" width="512" height="512" fill="#ffffff" />
      <!-- Black solid rocket shape punches out swoosh -->
      <g transform="translate(80, 80) scale(14.8)">
        <path fill="#000000" 
              d="M9.315 7.584C12.195 3.883 16.695 1.5 21.75 1.5a.75.75 0 0 1 .75.75c0 5.056-2.383 9.555-6.084 12.436A6.75 6.75 0 0 1 9.75 22.5a.75.75 0 0 1-.75-.75v-4.131A15.838 15.838 0 0 1 6.382 15H2.25a.75.75 0 0 1-.628-1.157 15.837 15.837 0 0 1 7.693-6.259Z" />
      </g>
    </mask>
  </defs>

  <!-- Flow S-Curve Trail (Punched out behind rocket) -->
  <path d="M 100 395 C 110 470, 230 480, 310 440 C 405 385, 450 270, 400 175 C 350 80, 255 90, 305 30 C 325 10, 375 5, 425 28" 
        fill="none" 
        stroke="url(#swooshGrad)" 
        stroke-width="30" 
        stroke-linecap="round"
        mask="url(#solidRocketMask)" />

  <!-- Official SkillFlow Rocket Emblem -->
  <g transform="translate(80, 80) scale(14.8)">
    <path fill="url(#brandGrad)" 
          fill-rule="evenodd" 
          d="M9.315 7.584C12.195 3.883 16.695 1.5 21.75 1.5a.75.75 0 0 1 .75.75c0 5.056-2.383 9.555-6.084 12.436A6.75 6.75 0 0 1 9.75 22.5a.75.75 0 0 1-.75-.75v-4.131A15.838 15.838 0 0 1 6.382 15H2.25a.75.75 0 0 1-.628-1.157 15.837 15.837 0 0 1 7.693-6.259Zm3.14 8.766a5.25 5.25 0 0 0 6.64-6.64 14.364 14.364 0 0 0-6.64 6.64Z" 
          clip-rule="evenodd" />
  </g>

  <!-- Sparkle Star Accent -->
  <g transform="translate(402, 102)">
    <path d="M 0 -20 Q 0 0 -20 0 Q 0 0 0 20 Q 0 0 20 0 Q 0 0 0 -20 Z" fill="#ffffff" />
    <circle cx="0" cy="0" r="3.5" fill="#38bdf8" />
  </g>
</svg>
