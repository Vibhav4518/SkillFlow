<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Dark Slate / Deep Navy) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Rocket Emblem Gradient (Blue -> Indigo -> Violet -> Cyan) -->
    <linearGradient id="brandGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="30%" stop-color="#4f46e5" />
      <stop offset="65%" stop-color="#7c3aed" />
      <stop offset="85%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Flow Swoosh Gradient -->
    <linearGradient id="swooshGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.1" />
      <stop offset="40%" stop-color="#6366f1" stop-opacity="0.5" />
      <stop offset="80%" stop-color="#06b6d4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="1" />
    </linearGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.7" />
    </linearGradient>

    <!-- Soft Radial Backlight Glow -->
    <radialGradient id="backlight" cx="60%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    
    <!-- Drop Shadow for Rocket -->
    <filter id="rocketShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#backlight)" />
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="none" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- Smooth Flow S-Curve Trail -->
  <path d="M 125 390 C 135 445, 230 455, 290 420 C 375 370, 425 270, 375 190 C 330 115, 255 125, 295 70 C 315 45, 360 40, 400 65" 
        fill="none" 
        stroke="url(#swooshGrad)" 
        stroke-width="16" 
        stroke-linecap="round" />

  <!-- Rocket Solid Backdrop Layer -->
  <g transform="translate(100, 100) scale(13)">
    <path fill="#0f172a" 
          d="M9.315 7.584C12.195 3.883 16.695 1.5 21.75 1.5a.75.75 0 0 1 .75.75c0 5.056-2.383 9.555-6.084 12.436A6.75 6.75 0 0 1 9.75 22.5a.75.75 0 0 1-.75-.75v-4.131A15.838 15.838 0 0 1 6.382 15H2.25a.75.75 0 0 1-.628-1.157 15.837 15.837 0 0 1 7.693-6.259Z" />
  </g>

  <!-- Official SkillFlow Rocket Icon -->
  <g filter="url(#rocketShadow)" transform="translate(100, 100) scale(13)">
    <path fill="url(#brandGrad)" 
          fill-rule="evenodd" 
          d="M9.315 7.584C12.195 3.883 16.695 1.5 21.75 1.5a.75.75 0 0 1 .75.75c0 5.056-2.383 9.555-6.084 12.436A6.75 6.75 0 0 1 9.75 22.5a.75.75 0 0 1-.75-.75v-4.131A15.838 15.838 0 0 1 6.382 15H2.25a.75.75 0 0 1-.628-1.157 15.837 15.837 0 0 1 7.693-6.259Zm3.14 8.766a5.25 5.25 0 0 0 6.64-6.64 14.364 14.364 0 0 0-6.64 6.64Z" 
          clip-rule="evenodd" />
  </g>

  <!-- Sparkle Star Accent -->
  <g transform="translate(383, 119)">
    <path d="M 0 -18 Q 0 0 -18 0 Q 0 0 0 18 Q 0 0 18 0 Q 0 0 0 -18 Z" fill="#ffffff" />
    <circle cx="0" cy="0" r="3" fill="#38bdf8" />
  </g>
</svg>
